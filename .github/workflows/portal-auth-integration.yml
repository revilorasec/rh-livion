name: Integrate RH with Portal auth

on:
  push:
    paths:
      - '.github/workflows/portal-auth-integration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply RH Portal integration patch
        run: python3 tools/patch_portal_auth.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: integrate RH authentication with Portal Livion"
            git push
          fi
